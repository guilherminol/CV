[project]
name = "career-tailor-backend"
version = "0.1.0"
description = "Career Tailor backend — FastAPI app served with uvicorn (application, not an installable package)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "playwright==1.62.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-frontmatter>=1.3.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["llm: real OpenRouter API calls (spend) — run explicitly with -m llm"]
addopts = "-m 'not llm'"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
